<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiStore | Panel de administración</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar barra" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">← Volver a MikiStore</a>
      <div class="d-flex gap-2">
        <button id="btnTema" class="btn btn-outline-light btn-sm" onclick="cambiarTema()">🌙</button>
        <button id="btnCerrarSesion" class="btn btn-outline-light btn-sm d-none" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container my-5">

    <section id="seccionLogin" class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-3">
              <img src="img/logo.svg" alt="Logo de MikiStore" width="56" height="56">
              <h4 class="mt-2">Panel de administración</h4>
            </div>
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuario</label>
              <input id="usuario" type="text" class="form-control">
            </div>
            <div class="mb-3">
              <label for="clave" class="form-label">Contraseña</label>
              <input id="clave" type="password" class="form-control">
            </div>
            <button class="btn btn-primary w-100" onclick="iniciarSesion()">Ingresar</button>
            <p class="text-center text-body-secondary small mt-3 mb-0">Usuario: <strong>admin</strong> · Contraseña: <strong>1234</strong></p>
          </div>
        </div>
      </div>
    </section>

    <section id="seccionPanel" class="row g-4 d-none">

      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 id="tituloFormulario" class="mb-3">Nuevo producto</h4>
            <input id="id" type="hidden">

            <div class="mb-2">
              <label for="nombre" class="form-label">Nombre</label>
              <input id="nombre" type="text" class="form-control">
            </div>
            <div class="mb-2">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea id="descripcion" class="form-control" rows="2"></textarea>
            </div>
            <div class="row">
              <div class="col-6 mb-2">
                <label for="precio" class="form-label">Precio (Bs)</label>
                <input id="precio" type="number" class="form-control" min="0" step="0.01">
              </div>
              <div class="col-6 mb-2">
                <label for="stock" class="form-label">Stock</label>
                <input id="stock" type="number" class="form-control" min="0" step="1">
              </div>
            </div>
            <div class="mb-2">
              <label for="categoria" class="form-label">Categoría</label>
              <select id="categoria" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label for="imagen" class="form-label">Imagen (link)</label>
              <input id="imagen" type="url" class="form-control" placeholder="https://...">
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-primary flex-fill" onclick="guardarProducto()">Guardar</button>
              <button class="btn btn-outline-secondary flex-fill" onclick="limpiarFormulario()">Limpiar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="mb-3">Productos</h4>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th class="text-end">Acciones</th>
                  </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
